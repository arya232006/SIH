name: Deploy to Hugging Face Space

# Keeps the Space mirroring main without putting build artefacts in the repo.
#
# The free Gradio SDK has no build step, so the Space needs frontend/dist
# committed. Committing it to main instead would mean every UI change requires a
# manual rebuild, and forgetting once leaves the deployed app quietly serving a
# stale interface. This builds on the runner and pushes a deploy-only commit, so
# main stays clean and the Space can never fall behind it.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare the deploy commit
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          set -e

          # A Docker Space is a paid feature, so the Space runs the Gradio SDK,
          # which reads its configuration from this frontmatter and will not
          # start without it. Added here rather than in the repo README so the
          # GitHub page stays clean.
          python - <<'PY'
          import io, re
          fm = (
              "---\n"
              "title: MediKiosk\n"
              "emoji: \U0001FA7A\n"
              "colorFrom: teal\n"
              "colorTo: indigo\n"
              "sdk: gradio\n"
              "app_file: app.py\n"
              "pinned: false\n"
              "---\n\n"
          )
          body = io.open("README.md", encoding="utf-8").read()
          body = re.sub(r"\A---\n.*?\n---\n\n?", "", body, count=1, flags=re.S)
          io.open("README.md", "w", encoding="utf-8").write(fm + body)
          PY

          # The Space installs Python dependencies from the repository root.
          cp backend/requirements.txt requirements.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist README.md requirements.txt
          git commit -m "deploy: build from ${GITHUB_SHA::7}"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::HF_TOKEN, HF_USERNAME and HF_SPACE must be set in repository secrets."
            exit 1
          fi
          # Force-push: the Space is a deploy target, not a branch with history
          # worth preserving. Its content is always whatever main last built.
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            HEAD:main
